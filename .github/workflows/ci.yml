name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref. On a PR, a new push cancels the prior
# run (cancel-in-progress). On main, the group is per-SHA so pushes never cancel
# each other — every main commit keeps its full run as the safety-net record.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  ci:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4.4.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Docs link check
        run: pnpm docs:check

      # 内部标识（内网域名/代号/私网地址/本机路径/账号名）不得进入公开仓库。
      # 规则文件 gitignored，走 CI secret（raw JSON 数组）注入：raw 时落盘内容 ===
      # secret 值，任何意外打印都会被 GitHub 自动 mask（base64 解码后 ≠ secret 值，
      # 打印不会被 mask，故这里不用 base64）。fork PR 拿不到 secret（GitHub 不给
      # fork 传 secret），硬 fail 会拦死外部贡献，只能跳过并显式标注 guard skipped。
      - name: Inject sensitive rules and check
        env:
          SENSITIVE_RULES: ${{ secrets.SENSITIVE_RULES }}
        run: |
          if [ -z "$SENSITIVE_RULES" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              echo "::warning::sensitive string guard skipped：fork PR 无法接收 SENSITIVE_RULES secret，本次未执行敏感串扫描"
              exit 0
            fi
            echo "::error::SENSITIVE_RULES secret 未配置，敏感串守护无法运行"
            exit 1
          fi
          printf '%s' "$SENSITIVE_RULES" > scripts/sensitive-rules.json
          pnpm sensitive:check:ci

      # 命中时 Step 1 会 exit 1，后续 step 被 skip，必须紧贴 Step 1 清理，避免规则
      # 文件残留在工作树（防御纵深：未来若有人加 upload-artifact 也不会带走）。
      - name: Clean up sensitive rules
        if: always()
        run: rm -f scripts/sensitive-rules.json

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # tsServerPaths tests read the version from the vendored
      # typescript-language-server's node_modules (outside the pnpm workspace,
      # installed via npm). Same reason as the e2e job's vendor install below.
      - name: Install vendored typescript-language-server (tsServerPaths tests)
        run: npm --prefix vendor/typescript-language-server ci

      - name: Test
        run: pnpm test

      # Root-level scripts (release / e2e affected matrix / gallery) live outside
      # any workspace package, so `turbo run test` doesn't cover them. Run their
      # node:test suites here so e.g. the affected-e2e-matrix routing rules are gated.
      - name: Test scripts
        run: pnpm test:release

      - name: Build
        run: pnpm build

  # Job DAG note: jobs fan out in parallel from the start. The only real data
  # dependency is detect-affected → the e2e/package matrix jobs (affected
  # outputs); every job builds what it needs itself via the turbo cache. There
  # is deliberately no `needs: ci` fail-fast gate — it serialized ~6 min of
  # wall time per run while lint/type errors are already caught by local
  # `pnpm check` + PR flow, and ci-gate remains the single aggregation point.
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4.4.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build (editor workspace deps dist required for integration imports)
        run: pnpm build --filter="@universe-editor/editor^..."

      - name: Run integration tests
        run: pnpm --filter @universe-editor/editor test:integration

  # External consumer anti-rot: scaffold both extension templates from packed
  # tarballs, build them against those tarballs, and `uex package` each into a
  # VSIX. Catches SDK/template/CLI drift the way a third-party author would.
  # Runs on both OSes because path/shell handling in the toolchain differs
  # (uex dev's editor lookup is excluded — it needs an installed editor,
  # covered by e2e instead).
  external-consumer-smoke:
    name: External Consumer Smoke
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4.4.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build toolchain packages
        run: >-
          pnpm build
          --filter=@universe-editor/extension-api
          --filter=@universe-editor/extension-manifest
          --filter=@universe-editor/extension-packaging
          --filter=@universe-editor/uex
          --filter=@universe-editor/create-extension

      - name: External consumer smoke (scaffold/sample → npm i → build → uex package)
        run: pnpm test:templates

  # Cross-repo ACP contract test: spawns the REAL built fork dist and asserts the
  # editor↔fork ext-method / _meta wire shape (see acpForkContract.integration.test).
  # Needs the submodules + `pnpm agent:build`, so it's gated by detect-affected to
  # the editor↔fork wire surface (main push forces it on). In the plain
  # `integration` job above the same spec self-skips (no fork dist there).
  acp-contract:
    name: ACP Cross-Repo Contract
    needs: detect-affected
    if: needs.detect-affected.outputs.acp-contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4.4.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Cache agent vendor deps
        uses: actions/cache@v5
        with:
          path: vendor/claude-agent-acp/node_modules
          key: agent-deps-${{ runner.os }}-${{ hashFiles('vendor/claude-agent-acp/package-lock.json') }}

      - name: Cache codex agent vendor deps
        uses: actions/cache@v5
        with:
          path: vendor/codex-acp/node_modules
          key: codex-agent-deps-${{ runner.os }}-${{ hashFiles('vendor/codex-acp/package-lock.json') }}

      # The contract test imports editor renderer source; platform dist must exist.
      - name: Build (platform dist required for integration imports)
        run: pnpm build --filter=@universe-editor/platform...

      # Build both fork dist artifacts (the real subprocess the contract test spawns).
      - name: Build agent forks
        run: pnpm agent:build

      # Runs the offline contract core: the ext-method NAME table + the
      # initialize handshake for both forks. The claude ext-method routing leg
      # self-skips here (it needs a real Claude binary via CLAUDE_CODE_EXECUTABLE,
      # which CI has no reason to install); it runs in local dev instead.
      - name: Run ACP contract test
        env:
          UNIVERSE_FORK_CONTRACT: '1'
        run: pnpm --filter @universe-editor/editor test:integration acpForkContract

  # Decide which E2E suites to run. On a PR we scope to what the change touched
  # (turbo affected, base = origin/main); on a main push we force EVERYTHING —
  # the full run is the safety net for the affected heuristic. Outputs drive the
  # `e2e` (core) gate and the `e2e-extensions` matrix below.
  detect-affected:
    name: Detect affected E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      core: ${{ steps.detect.outputs.core }}
      extensions: ${{ steps.detect.outputs.extensions }}
      has-extensions: ${{ steps.detect.outputs.has-extensions }}
      external: ${{ steps.detect.outputs.external }}
      has-external: ${{ steps.detect.outputs.has-external }}
      package-windows: ${{ steps.detect.outputs.package-windows }}
      acp-contract: ${{ steps.detect.outputs.acp-contract }}
    steps:
      - uses: actions/checkout@v5
        with:
          # affected diffing needs history back to the merge base with main.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4.4.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute affected E2E matrix
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin ${{ github.base_ref }}
            node scripts/e2e/affected-e2e-matrix.mjs --base origin/${{ github.base_ref }}
          else
            node scripts/e2e/affected-e2e-matrix.mjs --all
          fi

  e2e:
    name: E2E Smoke (${{ matrix.os }} ${{ matrix.shard }}/2)
    needs: detect-affected
    if: needs.detect-affected.outputs.core == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

    steps:
      - uses: actions/checkout@v5

      # Defender's real-time scan intermittently locks the Electron dist
      # (electron.exe / icudtl.dat) right as Playwright spawns it — the process
      # dies before the CDP pipe connects ("Process failed to launch!"), and the
      # scan window can outlast both the harness launch retry and a Playwright
      # test retry. Exclude the workspace to remove the lock at the source; the
      # launch-level retry in e2e-harness stays as the safety net.
      - name: Exclude workspace from Defender (Electron launch file locks)
        if: runner.os == 'Windows'
        shell: powershell
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"

      - uses: pnpm/action-setup@v4.4.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # Playwright bundles its own browsers — for `_electron` tests we only need
      # the Linux system libs (libnss3, libgtk, etc). On Windows nothing extra
      # is needed.
      - name: Install Playwright system dependencies (Linux)
        if: runner.os == 'Linux'
        run: pnpm --filter @universe-editor/editor exec playwright install-deps

      # The core suite's scoped fixtures (smoke.peekPreview / smoke.outline) drive
      # a real tsserver via the typescript extension, whose vendored
      # typescript-language-server lives OUTSIDE the pnpm workspace (installed via
      # npm). Without it those specs see empty symbols. Install just this vendor —
      # NOT the full vendor-install/agent:build, which needs the claude-agent-acp
      # submodule (not checked out in this job).
      - name: Install vendored typescript-language-server (TS LSP for peek/outline e2e)
        run: npm --prefix vendor/typescript-language-server ci

      - name: Build
        run: pnpm build

      - name: Run E2E smoke (Linux, xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" pnpm --filter @universe-editor/editor exec playwright test -c e2e/playwright.config.ts --shard=${{ matrix.shard }}/2

      # @regression cases guard specific fixed bugs (not core-path smoke). They are
      # excluded from the local `pnpm e2e` main pass to keep the day-to-day loop
      # fast, but still block CI here — same parallel shard×2 mechanism as the main
      # pass. Tag filtering lives in the shared config (UNIVERSE_E2E_ONLY_TAG); no
      # --grep flag. See apps/editor/e2e/CLAUDE.md.
      - name: Run E2E regression (Linux, xvfb)
        if: runner.os == 'Linux'
        run: UNIVERSE_E2E_ONLY_TAG=@regression xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" pnpm --filter @universe-editor/editor exec playwright test -c e2e/playwright.config.ts --shard=${{ matrix.shard }}/2

      # @serial cases switch the workspace twice and trip a cross-process race in
      # @parcel/watcher's windows backend under parallel workers; pin to one
      # worker. Run only on shard 1 so the (small) serial set isn't duplicated.
      - name: Run E2E smoke serial (Linux, xvfb)
        if: runner.os == 'Linux' && matrix.shard == 1
        run: UNIVERSE_E2E_ONLY_TAG=@serial xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" pnpm --filter @universe-editor/editor exec playwright test -c e2e/playwright.config.ts --workers=1

      # @flaky cases (e.g. headless drag-and-drop) are environment-sensitive, not
      # regressions — run them separately, report-only, so they never block the
      # @p0/@p1 gate. See apps/editor/e2e/CLAUDE.md. Only on shard 1.
      - name: Run E2E flaky (Linux, xvfb, non-blocking)
        if: runner.os == 'Linux' && matrix.shard == 1
        continue-on-error: true
        run: UNIVERSE_E2E_ONLY_TAG=@flaky xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" pnpm --filter @universe-editor/editor exec playwright test -c e2e/playwright.config.ts --workers=1

      # @perf records the startup timeline and the interaction-responsiveness
      # report into JSON/Markdown artifacts (observe-only, no budget assertion).
      # Single worker, Linux+shard 1 only. Non-blocking; the metrics are uploaded
      # below for regression tracking. See apps/editor/e2e/CLAUDE.md.
      - name: Run E2E startup perf (Linux, xvfb, observe-only)
        if: runner.os == 'Linux' && matrix.shard == 1
        continue-on-error: true
        run: UNIVERSE_E2E_ONLY_TAG=@perf xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" pnpm --filter @universe-editor/editor exec playwright test -c e2e/playwright.config.ts --workers=1

      - name: Upload perf metrics
        if: always() && runner.os == 'Linux' && matrix.shard == 1
        uses: actions/upload-artifact@v6
        with:
          name: perf-metrics
          path: |
            apps/editor/e2e/test-results/startup-metrics.json
            apps/editor/e2e/test-results/interaction-perf-report.*
          retention-days: 30
          if-no-files-found: ignore

      - name: Run E2E smoke (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: pnpm --filter @universe-editor/editor exec playwright test -c e2e/playwright.config.ts --shard=${{ matrix.shard }}/2

      # @regression: bug-guard cases excluded from the local main pass; still block
      # CI here via the same parallel shard×2 mechanism. Tag filtering lives in the
      # shared config (UNIVERSE_E2E_ONLY_TAG); no --grep flag. See apps/editor/e2e/CLAUDE.md.
      - name: Run E2E regression (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: UNIVERSE_E2E_ONLY_TAG=@regression pnpm --filter @universe-editor/editor exec playwright test -c e2e/playwright.config.ts --shard=${{ matrix.shard }}/2

      - name: Run E2E smoke serial (Windows)
        if: runner.os == 'Windows' && matrix.shard == 1
        shell: bash
        run: UNIVERSE_E2E_ONLY_TAG=@serial pnpm --filter @universe-editor/editor exec playwright test -c e2e/playwright.config.ts --workers=1

      - name: Run E2E flaky (Windows, non-blocking)
        if: runner.os == 'Windows' && matrix.shard == 1
        continue-on-error: true
        shell: bash
        run: UNIVERSE_E2E_ONLY_TAG=@flaky pnpm --filter @universe-editor/editor exec playwright test -c e2e/playwright.config.ts --workers=1

      # - name: Run visual regression (Linux only)
      #   if: runner.os == 'Linux'
      #   run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" pnpm --filter @universe-editor/editor test:visual

      - name: Upload visual diff artifacts
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: visual-diff-${{ matrix.os }}-${{ matrix.shard }}
          path: apps/editor/e2e/test-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.os }}-${{ matrix.shard }}
          path: apps/editor/e2e/playwright-report
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright test results (traces / videos / screenshots)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-traces-${{ matrix.os }}-${{ matrix.shard }}
          path: apps/editor/e2e/test-results
          retention-days: 14
          if-no-files-found: ignore

  # Per-extension E2E: one job per affected extension (see detect-affected). Each
  # extension owns its e2e/ dir + playwright.config.ts and runs against the shared
  # packaged editor build with ONLY that extension activated (P2 minimal set). The
  # matrix is empty on PRs that touch no extension → the job is skipped entirely.
  e2e-extensions:
    name: E2E ${{ matrix.suite.dir }}
    needs: detect-affected
    if: needs.detect-affected.outputs.has-extensions == 'true'
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJson(needs.detect-affected.outputs.extensions) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4.4.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install Playwright system dependencies (Linux)
        run: pnpm --filter @universe-editor/editor exec playwright install-deps

      # typescript extension specs drive the vendored typescript-language-server
      # (outside the pnpm workspace). Only install it for suites that need it.
      - name: Install vendored typescript-language-server
        if: matrix.suite.prep == 'tsserver'
        run: npm --prefix vendor/typescript-language-server ci

      - name: Build
        run: pnpm build

      # Playwright resolves outputDir / html outputFolder relative to the config
      # file's directory (e2e/), so artifacts land under <dir>/e2e/ — upload paths
      # must include that layer. `prep` is meaningless for naming (mostly 'none'),
      # so name artifacts after the suite dir basename instead.
      - name: Resolve suite short name
        id: suite
        run: echo "short=$(basename "${{ matrix.suite.dir }}")" >> "$GITHUB_OUTPUT"

      # `e2ea` (not `e2e`) folds the @regression bug-guard specs back into the pass;
      # extensions have no @serial/@flaky specs, so a single pass covers everything.
      - name: Run extension E2E (xvfb)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" pnpm --filter ${{ matrix.suite.name }} e2ea

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ steps.suite.outputs.short }}-${{ strategy.job-index }}
          path: ${{ matrix.suite.dir }}/e2e/playwright-report
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright test results (traces / videos / screenshots)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-traces-${{ steps.suite.outputs.short }}-${{ strategy.job-index }}
          path: ${{ matrix.suite.dir }}/e2e/test-results
          retention-days: 14
          if-no-files-found: ignore

  # Per-external-extension E2E: the marketplace extensions under extensions-external/*
  # are OUTSIDE the pnpm/turbo workspace, so they can't ride the turbo-affected matrix
  # above. detect-affected computes them by git path diff instead (a change to a
  # suite's dir, or to shared infra — editor / harness / contract / extension-host —
  # fans out to all). Each suite loads its extension off disk (VSCode's
  # --extensionDevelopmentPath model) via its own `e2e` script; no vsix install.
  e2e-external:
    name: E2E ${{ matrix.suite.dir }}
    needs: detect-affected
    if: needs.detect-affected.outputs.has-external == 'true'
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJson(needs.detect-affected.outputs.external) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4.4.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          package-manager-cache: false

      - name: Cache Excel npm downloads
        if: matrix.suite.prep == 'xlsx'
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-excel-${{ runner.os }}-node22-${{ hashFiles('extensions-external/excel-diff/package-lock.json') }}
          restore-keys: |
            npm-excel-${{ runner.os }}-node22-

      # The Excel extension bundles SheetJS from its own node_modules. Install its
      # standalone npm dependencies early so transient failures do not waste a build.
      - name: Install Excel extension deps
        if: matrix.suite.prep == 'xlsx'
        env:
          NPM_CONFIG_FETCH_RETRIES: 4
          NPM_CONFIG_FETCH_RETRY_FACTOR: 2
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 10000
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 60000
        run: npm --prefix extensions-external/${{ matrix.suite.name }} ci --prefer-offline --no-audit --no-fund

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install Playwright system dependencies (Linux)
        run: pnpm --filter @universe-editor/editor exec playwright install-deps

      # `pnpm --filter <pkg> build` calls the package's own build script directly,
      # bypassing turbo — so it wouldn't build the editor's workspace deps first
      # (e.g. @universe-editor/extension-gallery), and vite fails to resolve their
      # dist entry. Go through turbo with the `...` suffix to build deps + editor.
      #
      # @universe-editor/extension-host is NOT an editor dependency (the main
      # process loads its bundled dist/bootstrap.js by PATH at runtime, never
      # imports it), so `editor...` alone leaves that dist stale/absent and the
      # host scans zero user extensions → these suites all fail. Build it too.
      - name: Build editor + extension host
        run: pnpm build --filter=@universe-editor/editor... --filter=@universe-editor/extension-host...

      # Type-check the external extension before running it. esbuild (both the
      # suite build and run-external-e2e.mjs) strips types without checking them,
      # so a type error would otherwise sail through CI as long as the bundle
      # emits. The typecheck script borrows tsgo (@typescript/native-preview)
      # from the workspace root; the frozen-lockfile install above provides it.
      # Excel's own types come from its early standalone npm install.
      - name: Typecheck external extension
        run: npm --prefix extensions-external/${{ matrix.suite.name }} run typecheck

      # `e2ea` folds the @regression bug-guard specs back in (see e2e-extensions).
      - name: Run external extension E2E (xvfb)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" npm --prefix extensions-external/${{ matrix.suite.name }} run e2ea

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-external-${{ matrix.suite.name }}
          path: ${{ matrix.suite.dir }}/e2e/playwright-report
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright test results (traces / videos / screenshots)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-traces-external-${{ matrix.suite.name }}
          path: ${{ matrix.suite.dir }}/e2e/test-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Excel npm logs
        if: failure() && matrix.suite.prep == 'xlsx'
        uses: actions/upload-artifact@v6
        with:
          name: npm-logs-${{ matrix.suite.name }}
          path: ~/.npm/_logs/
          retention-days: 7
          if-no-files-found: ignore

  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4.4.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build (editor workspace deps dist required by bench imports)
        run: pnpm build --filter="@universe-editor/editor^..."

      - name: Run benchmarks
        run: pnpm --filter @universe-editor/editor bench

      # Build the renderer and report its gzipped bundle size against the
      # committed baseline. Soft (the whole bench job is continue-on-error) — a
      # regression shows up in logs/artifact without blocking the PR.
      - name: Build editor (renderer assets for bundle-size)
        run: pnpm build --filter=@universe-editor/editor

      - name: Report renderer bundle size
        run: pnpm bundle-size

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bench-results
          path: apps/editor/bench/baselines/
          retention-days: 30
          if-no-files-found: ignore

  package-windows:
    name: Package Windows Executable
    needs: detect-affected
    if: needs.detect-affected.outputs.package-windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      # The runner has 4 cores but turbo defaults to 10 concurrent tasks, so the
      # build fans out ~10 tsgo.exe at once. Observed failure: three tsgo spawned
      # within 2s and one died at -1073741502 (0xC0000142 STATUS_DLL_INIT_FAILED)
      # before it even echoed its command — the process never started work. This
      # is turbo's own scheduling knob, NOT a task-consumed variable, so it must
      # stay out of turbo.json's task `env` arrays (that would change cache keys).
      # Scope: this covers the turbo phase only (runtime:stage → ext:build, where
      # the observed failure was). The `pnpm --filter "...editor..." build` phase
      # of package:win schedules itself, and is covered by the retry below.
      TURBO_CONCURRENCY: 2

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # Same Defender contention as the e2e job, different victim: real-time scan
      # of freshly written build output locks DLLs while the next native compiler
      # process is initializing.
      - name: Exclude workspace from Defender (native build DLL init failures)
        shell: powershell
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"

      - uses: pnpm/action-setup@v4.4.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Cache agent vendor deps
        uses: actions/cache@v5
        with:
          path: vendor/claude-agent-acp/node_modules
          key: agent-deps-${{ runner.os }}-${{ hashFiles('vendor/claude-agent-acp/package-lock.json') }}

      - name: Cache codex agent vendor deps
        uses: actions/cache@v5
        with:
          path: vendor/codex-acp/node_modules
          key: codex-agent-deps-${{ runner.os }}-${{ hashFiles('vendor/codex-acp/package-lock.json') }}

      # Split into attempt + retry so a transient 0xC0000142 (a native compiler
      # dying during DLL init, before doing any work) does not red the whole run.
      # A genuine compile error simply fails both attempts and still fails the
      # job — nothing is swallowed. `continue-on-error` only covers attempt 1, and
      # the `outcome == 'failure'` condition means a cancelled job skips attempt 2.
      - name: Build Windows release artifacts
        id: package-win
        continue-on-error: true
        run: pnpm --filter @universe-editor/editor package:win

      - name: Build Windows release artifacts (retry)
        if: steps.package-win.outcome == 'failure'
        run: pnpm --filter @universe-editor/editor package:win

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: universe-editor-windows-release
          path: apps/editor/release
          retention-days: 14
          if-no-files-found: error

  # Aggregated gate: GitHub required status checks match by check name, but the
  # real job names above are dynamic (affected matrix, OS×shard) so none can be
  # registered directly. This fixed-name job waits for ALL of them and fails if
  # any failed or was cancelled — it is the single required check registered in
  # the main-branch ruleset. `if: always()` is essential: without it a failing
  # need would SKIP this job, and a skipped required check counts as passed.
  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - ci
      - integration
      - external-consumer-smoke
      - detect-affected
      - acp-contract
      - e2e
      - e2e-extensions
      - e2e-external
      - bench
      - package-windows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed or was cancelled
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          echo "$NEEDS" | node -e '
            const n = JSON.parse(require("fs").readFileSync(0, "utf8"))
            const bad = Object.entries(n).filter(([, v]) => !["success", "skipped"].includes(v.result))
            if (bad.length) {
              console.error("Failing jobs: " + bad.map(([k, v]) => k + "=" + v.result).join(", "))
              process.exit(1)
            }
          '
