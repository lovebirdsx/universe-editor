# 正式发布：v* tag push（或 workflow_dispatch 手动回填历史 tag）后，解析 tag/title，
# 创建同名 GitHub Release，打包 linux / windows 双平台 zip 上传到该 Release，
# 最后向 samples 仓库发 repository_dispatch 触发其 CI 下载产物跑 e2e。

name: Release Editor

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 要回填发布的版本 tag（如 v0.1.68）
        required: true
        type: string

# 同名 Release 的并发 view||create 竞态：正式发布串行排队（cancel-in-progress: false）。
concurrency:
  group: release-editor
  cancel-in-progress: false

# gh release create/edit/upload 需要 contents:write。
permissions:
  contents: write

jobs:
  # 把 push tag 与 workflow_dispatch 两种触发统一解析出目标 tag，并算出去掉 v 前缀
  # 的标题。GitHub 表达式无字符串替换函数，只能落到 shell 里用 ${tag#v} 剥离。
  resolve:
    name: Resolve tag and title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      title: ${{ steps.resolve.outputs.title }}
    steps:
      - name: Resolve tag and title
        id: resolve
        run: |
          tag="${{ github.event_name == 'push' && github.ref_name || inputs.tag }}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "title=Universe Editor ${tag#v}" >> "$GITHUB_OUTPUT"

  # 两个打包 job 并发时，各自 view||create 同一 release 存在竞态：两者都 view 不到
  # 又都去 create。这个 job 串在打包前，把 create/update 收口到单点。
  ensure-release:
    name: Ensure release
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 本 job 不 checkout，gh 需要显式仓库上下文。
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create or update release
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_TITLE: ${{ needs.resolve.outputs.title }}
        run: |
          set -euo pipefail
          notes="双平台编辑器产物，供 samples 仓库 e2e 下载。可执行文件：linux-unpacked/universe-editor、win-unpacked/Universe Editor.exe"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes "$notes"
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes "$notes"
          fi

  package-linux:
    name: Package Linux (dir)
    needs: [resolve, ensure-release]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

    steps:
      # runtime:stage 内部跑 `pnpm -w run agent:build`，需要 claude-agent-acp /
      # codex-acp 两个 git submodule 的 dist 产物。
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: pnpm/action-setup@v4.4.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Cache agent vendor deps
        uses: actions/cache@v5
        with:
          path: vendor/claude-agent-acp/node_modules
          key: agent-deps-${{ runner.os }}-${{ hashFiles('vendor/claude-agent-acp/package-lock.json') }}

      - name: Cache codex agent vendor deps
        uses: actions/cache@v5
        with:
          path: vendor/codex-acp/node_modules
          key: codex-agent-deps-${{ runner.os }}-${{ hashFiles('vendor/codex-acp/package-lock.json') }}

      # --linux dir 覆盖 yml 里的 AppImage target（CI 无 FUSE，不能产 .AppImage），
      # 产出 release/linux-unpacked/ 目录。verify-packaged 的 resourcesRoot 位置参数
      # 相对 repoRoot 解析，故这里传 apps/editor/release/linux-unpacked/resources。
      - name: Build Linux release artifacts (linux-unpacked dir)
        run: pnpm --filter @universe-editor/editor package:linux:dir

      # zip 保留 linux-unpacked/ 顶层目录；消费方解压后以
      # linux-unpacked/universe-editor 作为 UNIVERSE_EDITOR_BIN。
      - name: Zip linux-unpacked directory
        run: |
          cd apps/editor/release
          zip -r universe-editor-linux-x64.zip linux-unpacked

      - name: Upload Linux artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ needs.resolve.outputs.tag }} apps/editor/release/universe-editor-linux-x64.zip --clobber

  package-windows:
    name: Package Windows (dir)
    needs: [resolve, ensure-release]
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

    steps:
      # runtime:stage 内部跑 `pnpm -w run agent:build`，需要 claude-agent-acp /
      # codex-acp 两个 git submodule 的 dist 产物。
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: pnpm/action-setup@v4.4.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Cache agent vendor deps
        uses: actions/cache@v5
        with:
          path: vendor/claude-agent-acp/node_modules
          key: agent-deps-${{ runner.os }}-${{ hashFiles('vendor/claude-agent-acp/package-lock.json') }}

      - name: Cache codex agent vendor deps
        uses: actions/cache@v5
        with:
          path: vendor/codex-acp/node_modules
          key: codex-agent-deps-${{ runner.os }}-${{ hashFiles('vendor/codex-acp/package-lock.json') }}

      # --win dir 只产 win-unpacked/ 目录（不打 nsis 安装器）。verify-packaged 无需
      # 位置参数，默认即校验 release/win-unpacked/resources。
      - name: Build Windows release artifacts (win-unpacked dir)
        run: pnpm --filter @universe-editor/editor package:win:dir

      # 7z 保留 win-unpacked/ 顶层目录；消费方解压后以 win-unpacked/Universe Editor.exe
      # 作为 UNIVERSE_EDITOR_BIN。用 7z 而非 pwsh Compress-Archive：后者对大目录慢且易
      # 超时/损坏，7z 是 windows runner 预装、更快更可靠。
      - name: Zip win-unpacked directory
        run: |
          cd apps/editor/release
          7z a universe-editor-win-x64.zip win-unpacked

      - name: Upload Windows artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ needs.resolve.outputs.tag }} apps/editor/release/universe-editor-win-x64.zip --clobber

  notify-samples:
    name: Notify samples repo
    needs: [resolve, package-linux, package-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.SAMPLES_DISPATCH_TOKEN }}
    steps:
      - name: Dispatch editor-release to samples repo
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::SAMPLES_DISPATCH_TOKEN 未配置，跳过 samples CI 触发"
            exit 0
          fi
          gh api repos/lovebirdsx/universe-editor-extension-samples/dispatches \
            -f event_type=editor-release \
            -f "client_payload[tag]=${{ needs.resolve.outputs.tag }}"
