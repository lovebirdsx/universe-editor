<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Universe Editor — 下载</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1115;
        --card: #171a21;
        --fg: #e7e9ee;
        --muted: #9aa3b2;
        --accent: #4c8dff;
        --accent-hover: #3b7af0;
        --border: #262b36;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          'Microsoft YaHei',
          sans-serif;
        background: radial-gradient(1200px 600px at 50% -10%, #1b2130, var(--bg));
        color: var(--fg);
      }
      .card {
        position: relative;
        width: 100%;
        max-width: 560px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 40px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      }
      .dev-nav {
        position: absolute;
        top: 16px;
        right: 16px;
        display: flex;
        gap: 6px;
      }
      .icon-link {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        border: 1px solid transparent;
        border-radius: 9px;
        color: var(--muted);
        text-decoration: none;
        transition:
          color 0.15s ease,
          border-color 0.15s ease,
          background 0.15s ease;
      }
      .icon-link:hover,
      .icon-link:focus-visible {
        color: var(--fg);
        background: rgba(255, 255, 255, 0.05);
        border-color: var(--border);
        outline: none;
      }
      .icon-link svg {
        width: 17px;
        height: 17px;
      }
      .tip {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        z-index: 10;
        width: 210px;
        padding: 10px 12px;
        text-align: left;
        background: #1e2330;
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-3px);
        transition:
          opacity 0.15s ease,
          transform 0.15s ease,
          visibility 0.15s;
        pointer-events: none;
      }
      .icon-link:hover .tip,
      .icon-link:focus-visible .tip {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }
      .tip-title {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--fg);
      }
      .tip-desc {
        display: block;
        margin-top: 4px;
        font-size: 12px;
        line-height: 1.6;
        color: var(--muted);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 4px;
      }
      h1 {
        font-size: 22px;
        margin: 0;
        font-weight: 600;
      }
      .meta {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 13px;
        margin: 12px 0 28px;
      }
      .badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 999px;
        background: rgba(76, 141, 255, 0.15);
        color: var(--accent);
        font-weight: 600;
        font-size: 13px;
      }
      .download {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        padding: 16px;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
        transition: background 0.15s ease;
      }
      .download:hover {
        background: var(--accent-hover);
      }
      .download .size {
        font-weight: 400;
        opacity: 0.85;
        font-size: 14px;
      }
      .notes {
        margin-top: 32px;
      }
      .notes h2 {
        font-size: 14px;
        color: var(--muted);
        font-weight: 600;
        margin: 0 0 16px;
        text-transform: uppercase;
        letter-spacing: 0;
      }
      .version-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--fg);
        margin: 0 0 8px;
      }
      .entry + .entry {
        margin-top: 22px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
      }
      .entry-title {
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 8px;
        color: var(--fg);
      }
      .entry-summary {
        margin: 0;
        font-size: 14px;
        line-height: 1.7;
        color: var(--muted);
      }
      .entry-more {
        display: inline-block;
        margin-top: 8px;
        font-size: 13px;
        color: var(--accent);
        text-decoration: none;
      }
      .entry-more:hover {
        text-decoration: underline;
      }
      .notes-more {
        margin-top: 20px;
        padding-top: 18px;
        border-top: 1px solid var(--border);
      }
      .notes-more a {
        font-size: 13px;
        color: var(--accent);
        text-decoration: none;
      }
      .notes-more a:hover {
        text-decoration: underline;
      }
      .state {
        color: var(--muted);
        font-size: 14px;
        text-align: center;
        padding: 24px 0;
      }
      .hidden {
        display: none;
      }
      .foot {
        margin-top: 32px;
        text-align: center;
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <nav class="dev-nav" aria-label="开发者入口">
        <a class="icon-link" href="gallery/register" aria-label="开发者注册">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <polyline points="16 18 22 12 16 6"></polyline>
            <polyline points="8 6 2 12 8 18"></polyline>
          </svg>
          <span class="tip" role="tooltip">
            <span class="tip-title">开发者注册</span>
            <span class="tip-desc">申请发布权限，获取扩展发布 token</span>
          </span>
        </a>
        <a class="icon-link" href="gallery/admin" aria-label="管理员入口">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
          <span class="tip" role="tooltip">
            <span class="tip-title">管理员入口</span>
            <span class="tip-desc">注册审批与发布者管理</span>
          </span>
        </a>
      </nav>

      <div class="brand">
        <h1>Universe Editor</h1>
      </div>

      <div id="loading" class="state">正在获取最新版本…</div>

      <div id="content" class="hidden">
        <div class="meta">
          <span class="badge" id="version"></span>
          <span id="date"></span>
        </div>

        <a class="download" id="download" href="#">
          <span>下载 Windows 版</span>
          <span class="size" id="size"></span>
        </a>

        <section class="notes hidden" id="notes">
          <h2>更新说明</h2>
          <div id="entries"></div>
          <div class="notes-more hidden" id="notes-more">
            <a id="all-versions" href="notes/index.html">全部版本介绍 →</a>
          </div>
        </section>
      </div>

      <div id="error" class="state hidden">暂时无法获取版本信息，请稍后重试。</div>

      <div class="foot">Universe Editor · VSCode 范式的游戏内容编辑器</div>
    </main>

    <script>
      // 更新说明区块的数据来源（逐级降级，任一环失败都不影响下载按钮）：
      //   1. notes/index.json —— 编译产物，带每版静态页路径（可点进完整介绍）
      //   2. release-notes.json —— 只有元数据，没有页面可链接
      //   3. 都没有 —— 隐藏整个区块
      // 版本上限取 latest.yml：绝不宣传还没发布的版本。
      const NOTE_WINDOW_DAYS = 7
      const DAY_MS = 24 * 60 * 60 * 1000

      function parseLatestYml(text) {
        const lines = text.split(/\r?\n/)
        const out = { version: '', releaseDate: '', files: [] }
        let inFiles = false
        let current = null
        for (const raw of lines) {
          const line = raw.replace(/\s+$/, '')
          const top = /^([a-zA-Z]+):\s*(.*)$/.exec(line)
          if (top && !line.startsWith(' ') && !line.startsWith('-')) {
            inFiles = top[1] === 'files'
            current = null
            if (top[1] === 'version') out.version = top[2].trim()
            else if (top[1] === 'releaseDate') out.releaseDate = unquote(top[2].trim())
            continue
          }
          if (!inFiles) continue
          const urlMatch = /^\s*-\s*url:\s*(.+)$/.exec(line)
          if (urlMatch) {
            current = { url: unquote(urlMatch[1].trim()), size: 0 }
            out.files.push(current)
            continue
          }
          const sizeMatch = /^\s*size:\s*(\d+)\s*$/.exec(line)
          if (sizeMatch && current) current.size = Number(sizeMatch[1])
        }
        return out
      }

      function unquote(s) {
        return s.replace(/^['"]|['"]$/g, '')
      }

      function formatSize(bytes) {
        if (!bytes) return ''
        const mb = bytes / (1024 * 1024)
        return mb >= 1 ? `${mb.toFixed(1)} MB` : `${Math.round(bytes / 1024)} KB`
      }

      function formatDate(raw) {
        if (!raw) return ''
        const dateKey = toDateKey(raw)
        if (dateKey) return dateKey
        const d = new Date(raw)
        if (Number.isNaN(d.getTime())) return String(raw).slice(0, 10)
        const p = (n) => String(n).padStart(2, '0')
        return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`
      }

      function toDateKey(raw) {
        if (!raw) return ''
        const text = String(raw)
        const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(text)
        if (m) {
          const key = `${m[1]}-${m[2]}-${m[3]}`
          return Number.isNaN(dateKeyToDay(key)) ? '' : key
        }
        const d = new Date(text)
        if (Number.isNaN(d.getTime())) return ''
        return formatUtcDate(d)
      }

      function formatUtcDate(date) {
        const p = (n) => String(n).padStart(2, '0')
        return `${date.getUTCFullYear()}-${p(date.getUTCMonth() + 1)}-${p(date.getUTCDate())}`
      }

      function dateKeyToDay(key) {
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(key)
        if (!m) return Number.NaN
        const year = Number(m[1])
        const month = Number(m[2])
        const day = Number(m[3])
        const time = Date.UTC(year, month - 1, day)
        const d = new Date(time)
        if (
          d.getUTCFullYear() !== year ||
          d.getUTCMonth() + 1 !== month ||
          d.getUTCDate() !== day
        ) {
          return Number.NaN
        }
        return Math.floor(time / DAY_MS)
      }

      // 数值分段比较（与服务端/应用一致）：0.10.0 > 0.9.0。
      function compareVersions(a, b) {
        const pa = String(a || '')
          .replace(/^v/, '')
          .split(/[-+]/)[0]
          .split('.')
        const pb = String(b || '')
          .replace(/^v/, '')
          .split(/[-+]/)[0]
          .split('.')
        const len = Math.max(pa.length, pb.length)
        for (let i = 0; i < len; i++) {
          const diff = (Number.parseInt(pa[i], 10) || 0) - (Number.parseInt(pb[i], 10) || 0)
          if (diff !== 0) return diff < 0 ? -1 : 1
        }
        return 0
      }

      function asText(value) {
        return typeof value === 'string' ? value : ''
      }

      function normalizeIndex(raw) {
        if (!raw || !Array.isArray(raw.versions)) return null
        return raw.versions
          .filter((entry) => entry && asText(entry.version))
          .map((entry) => ({
            version: asText(entry.version),
            date: asText(entry.date),
            title: asText(entry.title),
            summary: asText(entry.summary),
            path: asText(entry.path),
          }))
      }

      // 旧形态（应用内发布的 release-notes.json）：只有元数据，没有静态页。
      function normalizeRuntime(raw) {
        if (!Array.isArray(raw)) return null
        return raw
          .filter((entry) => entry && asText(entry.version))
          .map((entry) => ({
            version: asText(entry.version),
            date: asText(entry.date),
            title: asText(entry.title),
            summary: asText(entry.summary),
            path: '',
          }))
      }

      function show(id) {
        document.getElementById(id).classList.remove('hidden')
      }
      function hide(id) {
        document.getElementById(id).classList.add('hidden')
      }

      /**
       * 最近窗口内的版本；最新版本的介绍永远保留（发布日缺失或窗口落空都不能让它消失），
       * 且不展示高于 latest.yml 的版本。
       */
      function selectEntries(versions, latest) {
        const capped = versions.filter(
          (entry) => compareVersions(entry.version, latest.version) <= 0,
        )
        if (capped.length === 0) return []
        const current = capped.find((entry) => entry.version === latest.version)
        const anchorKey = (current && toDateKey(current.date)) || toDateKey(latest.releaseDate)
        const anchorDay = anchorKey ? dateKeyToDay(anchorKey) : Number.NaN
        const startDay = Number.isNaN(anchorDay) ? Number.NaN : anchorDay - NOTE_WINDOW_DAYS + 1
        let recent = Number.isNaN(startDay)
          ? []
          : capped.filter((entry) => {
              const day = dateKeyToDay(toDateKey(entry.date))
              return !Number.isNaN(day) && day >= startDay && day <= anchorDay
            })
        if (current && !recent.some((entry) => entry.version === current.version)) {
          recent = [current, ...recent]
        }
        return recent
      }

      function renderEntries(versions, latest, { pages }) {
        const entries = selectEntries(versions, latest)
        if (entries.length === 0) return false
        const container = document.getElementById('entries')
        container.textContent = ''
        for (const entry of entries) {
          renderEntry(container, entry, pages)
        }
        return container.children.length > 0
      }

      function renderEntry(container, entry, pages) {
        const wrap = document.createElement('div')
        wrap.className = 'entry'
        const title = document.createElement('div')
        title.className = 'version-title'
        const date = formatDate(entry.date)
        title.textContent = date ? `v${entry.version} · ${date}` : `v${entry.version}`
        wrap.appendChild(title)
        if (entry.title) {
          const headline = document.createElement('div')
          headline.className = 'entry-title'
          headline.textContent = entry.title
          wrap.appendChild(headline)
        }
        if (entry.summary) {
          const summary = document.createElement('p')
          summary.className = 'entry-summary'
          summary.textContent = entry.summary
          wrap.appendChild(summary)
        }
        if (pages && entry.path) {
          const more = document.createElement('a')
          more.className = 'entry-more'
          more.href = `notes/${entry.path}`
          more.textContent = '查看完整介绍 →'
          wrap.appendChild(more)
        }
        container.appendChild(wrap)
      }

      async function fetchJson(url) {
        const res = await fetch(url, { cache: 'no-store' })
        if (!res.ok) return null
        try {
          return await res.json()
        } catch {
          return null
        }
      }

      async function loadNotes() {
        const index = normalizeIndex(await fetchJson('notes/index.json'))
        if (index) return { versions: index, pages: true }
        const runtime = normalizeRuntime(await fetchJson('release-notes.json'))
        if (runtime) return { versions: runtime, pages: false }
        return null
      }

      async function main() {
        try {
          const res = await fetch('latest.yml', { cache: 'no-store' })
          if (!res.ok) throw new Error(`latest.yml ${res.status}`)
          const latest = parseLatestYml(await res.text())
          const exe = latest.files.find((f) => /\.exe$/i.test(f.url))
          if (!exe) throw new Error('latest.yml 中没有 .exe 安装包')

          document.getElementById('version').textContent = `v${latest.version}`
          document.getElementById('date').textContent = formatDate(latest.releaseDate)
          const link = document.getElementById('download')
          link.href = encodeURI(exe.url)
          link.setAttribute('download', '')
          document.getElementById('size').textContent = formatSize(exe.size)

          hide('loading')
          show('content')

          // 更新说明失败不影响主流程：单独 try，拿不到就只展示下载按钮。
          try {
            const notes = await loadNotes()
            if (notes && renderEntries(notes.versions, latest, notes)) {
              show('notes')
              if (notes.pages) show('notes-more')
            }
          } catch {
            /* 忽略：无更新说明时不展示该区块 */
          }
        } catch {
          hide('loading')
          show('error')
        }
      }

      // 测试入口：给用例确定性地 await 渲染结果，而不是数 setTimeout。
      globalThis.__ueDownloadPage = {
        main,
        parseLatestYml,
        compareVersions,
        selectEntries,
        normalizeIndex,
        normalizeRuntime,
        formatDate,
        formatSize,
      }
      if (!globalThis.__UE_DOWNLOAD_PAGE_NO_AUTORUN__) main()
    </script>
  </body>
</html>
